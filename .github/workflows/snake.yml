name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: kashmita-dot
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#800020&color_dots=#FADADD,#F4B6C2,#E98BA3,#D95F82,#C23B67&color_dot_border=#F6C9D3
      - name: Add baby pink background
        run: |
          sudo chown -R $USER:$USER dist
          sed -i 's|\(<svg[^>]*>\)|\1<rect width="100%" height="100%" fill="#FFE4EA"/>|' dist/github-contribution-grid-snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
